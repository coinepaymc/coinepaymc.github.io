# 文章页推广位内容。改这个文件即可，不用动 HTML/CSS。
# enable: false 可一键关掉全站推广位。
enable: true

# ── 三个广告位的投放位置 ──────────────────────
#   after-intro = 第一个小标题之前（开头，曝光最高）
#   middle      = 文章中部（读者已读进去）
#   end         = 文章末尾（读完，转化意图最强）
#   off         = 关闭该位
# 小标题不够多时，inline 位会自动退回文末，不会挤在一起。
placement:
  card: after-intro
  energy: middle
  contact: end

# 右上角小标签，留空字符串 "" 则不显示
badge: "推广"

# ── 板块一：开卡 ──────────────────────────────
