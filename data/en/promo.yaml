energy:
  icon: "⚡"
  title: "Merchants running volume: bring TRC20 fees down"
  points:
    - "Every USDT-TRC20 transfer burns <b>13–27 TRX</b> when energy runs short. It depends on the number of transfers, not the amount — which makes it a standing cost for any merchant running volume."
    - "With rented energy that falls to <b>1.5–1.7 TRX</b> per transfer when the recipient already holds USDT; a first transfer into an empty address needs 130,000 energy, about <b>3.0–3.4 TRX</b>."
    - "Exchanges and payment merchants can connect the API and rent per transfer automatically, with nothing to watch manually."
    - "No registration needed: send TRX to the platform address and the energy is delegated back to the paying address."
  cta:
    label: "Integrate the rental API"
    url: "https://login.trxapi.io/energy"
